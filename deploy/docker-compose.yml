# Local validation stack for the CODE-branded NetBox platform.
#   docker compose -f deploy/docker-compose.yml up -d --build
#   http://localhost:8000/   (admin / admin)
name: code-netbox

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: netbox
      POSTGRES_USER: netbox
      POSTGRES_PASSWORD: netbox
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netbox']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8-alpine
    command: valkey-server --save '' --appendonly no
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 20

  netbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: netbox
      REDIS_HOST: redis
      SUPERUSER_NAME: admin
      SUPERUSER_EMAIL: admin@code.sa
      SUPERUSER_PASSWORD: admin
    ports:
      - '8000:8000'
    volumes:
      # Mount the deployment config and the branding plugin so both can be
      # edited without rebuilding the image.
      - ./configuration.py:/opt/netbox/netbox/netbox/configuration.py:ro
      - ../code_branding:/opt/netbox/code_branding

volumes:
  pgdata:
